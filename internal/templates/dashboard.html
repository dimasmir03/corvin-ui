{{define "content"}}
<div id="app">
    <div class="content-header mb-3">
        <h1>Dashboard</h1>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-lg-3 col-md-6">
            <div class="small-box bg-info">
                <div class="inner">
                    <h3>{{.ServerCount}}</h3>
                    <p>Серверы</p>
                </div>
                <div class="icon"><i class="fas fa-server"></i></div>
            </div>
        </div>
        <div class="col-lg-3 col-md-6">
            <div class="small-box bg-success">
                <div class="inner">
                    <h3>{{.OnlineNow}}</h3>
                    <p>Онлайн сейчас</p>
                </div>
                <div class="icon"><i class="fas fa-signal"></i></div>
            </div>
        </div>
        <div class="col-lg-3 col-md-6">
            <div class="small-box bg-primary">
                <div class="inner">
                    <h3>{{.ActiveUsers}}</h3>
                    <p>Активные пользователи</p>
                </div>
                <div class="icon"><i class="fas fa-users"></i></div>
            </div>
        </div>
        <div class="col-lg-3 col-md-6">
            <div class="small-box bg-warning">
                <div class="inner">
                    <h3>{{.TotalBandwidth}}</h3>
                    <p>Трафик</p>
                </div>
                <div class="icon"><i class="fas fa-network-wired"></i></div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header border-0 d-flex align-items-center justify-content-between">
            <h3 class="card-title mb-0"><i class="fas fa-chart-line mr-1"></i> Общий онлайн</h3>
            <div class="btn-group btn-group-sm" role="group" aria-label="Online history range">
                <button v-for="item in ranges" :key="item.value" type="button" class="btn" :class="range === item.value ? 'btn-primary' : 'btn-outline-primary'" @click="setRange(item.value)">
                    [[ item.label ]]
                </button>
            </div>
        </div>
        <div class="card-body">
            <div v-if="emptyState" class="text-center text-muted py-5">Данных пока нет</div>
            <div id="onlineHistoryChart" v-show="!emptyState" style="min-height: 360px;"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.37.1/dist/apexcharts.min.js"></script>
<script>
    const app = new Vue({
        delimiters: ["[[", "]]"],
        el: "#app",
        data() {
            return {
                chart: null,
                range: "24h",
                emptyState: false,
                ranges: [
                    { value: "1h", label: "1ч" },
                    { value: "6h", label: "6ч" },
                    { value: "24h", label: "24ч" },
                    { value: "7d", label: "7д" },
                ],
            }
        },
        methods: {
            setRange(value) {
                this.range = value;
                this.fetchOnlineHistory();
            },
            async fetchOnlineHistory() {
                try {
                    const { data } = await axios.get(`/api/servers/online_history?range=${this.range}`);
                    if (!data.success) {
                        this.emptyState = true;
                        return;
                    }
                    const points = (data.obj && data.obj.points) || [];
                    this.emptyState = points.length === 0;
                    this.renderChart(points.map((point) => ({
                        x: new Date(point.time).getTime(),
                        y: point.online || 0,
                    })));
                } catch (error) {
                    console.error("Error loading online history:", error);
                    this.emptyState = true;
                }
            },
            renderChart(seriesData) {
                if (this.emptyState) {
                    if (this.chart) {
                        this.chart.updateSeries([{ name: "Online", data: [] }]);
                    }
                    return;
                }

                const options = {
                    series: [{ name: "Online", data: seriesData }],
                    chart: {
                        id: "online-history-chart",
                        type: "area",
                        height: 360,
                        toolbar: { show: false },
                        animations: { enabled: true },
                    },
                    dataLabels: { enabled: false },
                    stroke: { curve: "smooth", width: 3 },
                    fill: {
                        type: "gradient",
                        gradient: { shadeIntensity: 0.2, opacityFrom: 0.35, opacityTo: 0.02 },
                    },
                    colors: ["#0d6efd"],
                    xaxis: {
                        type: "datetime",
                        labels: {
                            datetimeUTC: false,
                            formatter: (value) => this.formatAxisTime(value),
                        },
                    },
                    yaxis: {
                        min: 0,
                        forceNiceScale: true,
                        labels: { formatter: (value) => Math.round(value).toString() },
                    },
                    tooltip: {
                        x: { formatter: (value) => this.formatTooltipTime(value) },
                        y: { formatter: (value) => `${Math.round(value)} online` },
                    },
                    grid: { strokeDashArray: 4 },
                };

                if (!this.chart) {
                    this.chart = new ApexCharts(document.querySelector("#onlineHistoryChart"), options);
                    this.chart.render();
                    return;
                }

                this.chart.updateOptions(options, false, true);
            },
            formatAxisTime(value) {
                return new Date(value).toLocaleString("ru-RU", {
                    day: this.range === "7d" ? "2-digit" : undefined,
                    month: this.range === "7d" ? "2-digit" : undefined,
                    hour: "2-digit",
                    minute: "2-digit",
                });
            },
            formatTooltipTime(value) {
                return new Date(value).toLocaleString("ru-RU", {
                    day: "2-digit",
                    month: "short",
                    hour: "2-digit",
                    minute: "2-digit",
                });
            },
        },
        mounted() {
            this.fetchOnlineHistory();
        },
    });
</script>
{{end}}
